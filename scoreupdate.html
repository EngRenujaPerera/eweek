<!-- ==========================================================================
     FILE: scoreupdater.html (E-WEEK 2026 Admin Management Portal - App Ready)
     ========================================================================== -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>E-WEEK 2026 | Management Portal</title>
  <meta name="theme-color" content="#080a0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --color-obsidian: #080a0f;
      --color-charcoal: #0e1117;
      --color-card-bg: rgba(16, 20, 29, 0.88);
      --color-silver-pure: #ffffff;
      --color-silver-bright: #e2e7f0;
      --color-silver-mid: #94a3b8;
      --color-gold: #c5a059;
      --color-gold-light: #dfbd7e;
      --color-crimson: #ff4d4d;
      --color-emerald: #10b981;
      --font-display: 'Cinzel', serif;
      --font-body: 'Inter', sans-serif;
      --transition: all 0.25s ease;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background-color: var(--color-obsidian);
      color: var(--color-silver-bright);
      font-family: var(--font-body);
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, #151c28 0%, var(--color-obsidian) 70%);
      background-attachment: fixed;
      position: relative;
      overflow-x: hidden;
      padding-bottom: env(safe-area-inset-bottom, 24px);
    }

    #particle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
      opacity: 0.55;
    }

    /* App Header */
    header {
      position: sticky;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 100;
      padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 14px;
      background: rgba(8, 10, 15, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(226, 231, 240, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .back-home {
      font-family: var(--font-display);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--color-gold);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .header-tag {
      font-family: var(--font-display);
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      color: var(--color-silver-mid);
    }

    .container {
      width: 92%;
      max-width: 680px;
      margin: 0 auto;
      position: relative;
      z-index: 10;
    }

    .admin-main-section {
      padding: 24px 0 60px;
      text-align: center;
    }

    .section-eyebrow {
      font-family: var(--font-display);
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      color: var(--color-gold);
      text-transform: uppercase;
      display: block;
      margin-bottom: 6px;
    }

    .section-title {
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      color: #fff;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .section-subtitle {
      font-size: 0.88rem;
      color: var(--color-silver-mid);
      margin-bottom: 24px;
      line-height: 1.4;
    }

    /* Mobile Segmented Tab Controller */
    .portal-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      background: rgba(14, 17, 23, 0.9);
      padding: 6px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 24px;
      user-select: none;
    }

    .tab-btn {
      font-family: var(--font-display);
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 10px 4px;
      background: transparent;
      border: none;
      color: var(--color-silver-mid);
      border-radius: 6px;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--color-gold) 0%, #8c6239 100%);
      color: #080a0f;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(197, 160, 89, 0.3);
    }

    /* Form Panel Card */
    .admin-panel {
      background: var(--color-card-bg);
      border: 1px solid rgba(197, 160, 89, 0.3);
      border-radius: 14px;
      padding: 24px 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      text-align: left;
    }

    .form-section { display: none; }
    .form-section.active { display: block; }

    .form-group { margin-bottom: 18px; }
    
    .form-label {
      display: block;
      font-family: var(--font-display);
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--color-gold-light);
      margin-bottom: 7px;
    }

    .form-control, .form-select {
      width: 100%;
      min-height: 46px;
      padding: 11px 14px;
      background: rgba(8, 10, 15, 0.85);
      border: 1px solid rgba(226, 231, 240, 0.15);
      border-radius: 8px;
      color: #fff;
      font-family: var(--font-body);
      font-size: 0.92rem;
      transition: var(--transition);
      -webkit-appearance: none;
      appearance: none;
    }

    select.form-select {
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c5a059' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 14px center;
      background-size: 16px;
      padding-right: 36px;
    }

    .form-control:focus, .form-select:focus {
      outline: none;
      border-color: var(--color-gold);
      box-shadow: 0 0 10px rgba(197, 160, 89, 0.25);
    }

    .matchup-grid {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: center;
    }

    .vs-badge {
      font-family: var(--font-display);
      font-weight: 800;
      color: var(--color-gold);
      font-size: 0.95rem;
      text-align: center;
    }

    .placement-card {
      background: rgba(8, 10, 15, 0.6);
      border: 1px solid rgba(197, 160, 89, 0.2);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .placement-title {
      font-family: var(--font-display);
      font-size: 0.74rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-gold-light);
      margin-bottom: 8px;
    }

    .placement-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 10px;
    }

    .image-preview-wrapper {
      margin-top: 10px;
      display: none;
      align-items: center;
      gap: 12px;
      padding: 10px;
      background: rgba(8, 10, 15, 0.7);
      border: 1px dashed rgba(197, 160, 89, 0.4);
      border-radius: 8px;
    }

    .image-preview-wrapper img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--color-gold);
    }

    .image-preview-info {
      font-size: 0.78rem;
      color: var(--color-silver-mid);
      word-break: break-all;
    }

    .btn-submit {
      display: block;
      width: 100%;
      min-height: 48px;
      padding: 14px;
      font-family: var(--font-display);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #080a0f;
      background: linear-gradient(135deg, var(--color-gold) 0%, #8c6239 100%);
      border: 1px solid #fff;
      border-radius: 8px;
      cursor: pointer;
      transition: var(--transition);
      margin-top: 16px;
      user-select: none;
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status-msg {
      margin-top: 16px;
      text-align: center;
      font-family: var(--font-display);
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      min-height: 1.2em;
    }

    @media (max-width: 480px) {
      .portal-tabs {
        grid-template-columns: repeat(2, 1fr);
      }
      .admin-panel {
        padding: 20px 16px;
      }
    }
  </style>
</head>

<body>
  <canvas id="particle-canvas" aria-hidden="true"></canvas>

  <header>
    <a href="index.html" class="back-home">&larr; HOME</a>
    <div class="header-tag">E-WEEK 2026 ADMIN</div>
  </header>

  <main class="container admin-main-section">
    <span class="section-eyebrow">TOURNAMENT SYSTEM</span>
    <h1 class="section-title">CONTROL PORTAL</h1>
    <p class="section-subtitle">Real-time match scoring, fixtures, other events, and news feed publisher.</p>

    <div class="portal-tabs" role="tablist">
      <button class="tab-btn active" onclick="switchTab('scores')">Scores</button>
      <button class="tab-btn" onclick="switchTab('other')">Placements</button>
      <button class="tab-btn" onclick="switchTab('fixtures')">Fixtures</button>
      <button class="tab-btn" onclick="switchTab('news')">News</button>
    </div>

    <div class="admin-panel">
      <!-- 1. SCORES -->
      <form id="scoreUpdateForm" class="form-section active">
        <div class="form-group">
          <label class="form-label" for="eventSelect">Sport / Event</label>
          <select id="eventSelect" class="form-select" required>
            <option value="" disabled selected>-- Select Event --</option>
            <option value="Cricket">Cricket</option>
            <option value="Football">Football</option>
            <option value="Volleyball">Volleyball</option>
            <option value="Basketball">Basketball</option>
            <option value="Netball">Netball</option>
            <option value="Elle">Elle</option>
            <option value="Badminton">Badminton</option>
            <option value="Table Tennis">Table Tennis</option>
            <option value="Carrom">Carrom</option>
            <option value="Chess">Chess</option>
            <option value="Debate">Debate</option>
            <option value="E Speaker">E Speaker</option>
            <option value="Athletics">Athletics Track Events</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="categorySelect">Category</label>
          <select id="categorySelect" class="form-select" required>
            <option value="MEN">Men Category</option>
            <option value="WOMEN">Women Category</option>
            <option value="COMMON">Common / Open Category</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Matchup</label>
          <div class="matchup-grid">
            <select id="teamASelect" class="form-select" required>
              <option value="" disabled selected>Team A</option>
              <option value="E22">E22</option>
              <option value="E23">E23</option>
              <option value="E24">E24</option>
              <option value="E25">E25</option>
              <option value="STAFF">STAFF</option>
            </select>
            <span class="vs-badge">VS</span>
            <select id="teamBSelect" class="form-select" required>
              <option value="" disabled selected>Team B</option>
              <option value="E22">E22</option>
              <option value="E23">E23</option>
              <option value="E24">E24</option>
              <option value="E25">E25</option>
              <option value="STAFF">STAFF</option>
            </select>
          </div>
        </div>

        <div class="matchup-grid form-group">
          <div>
            <label class="form-label" for="scoreA">Points / Score A</label>
            <input type="number" id="scoreA" class="form-control" placeholder="e.g. 145" required />
          </div>
          <div></div>
          <div>
            <label class="form-label" for="scoreB">Points / Score B</label>
            <input type="number" id="scoreB" class="form-control" placeholder="e.g. 130" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="matchStatus">Match State</label>
          <select id="matchStatus" class="form-select" required>
            <option value="Completed">Completed</option>
            <option value="Live">Live / Ongoing</option>
            <option value="Upcoming">Upcoming</option>
          </select>
        </div>

        <button type="submit" class="btn-submit" id="submitScoreBtn">Publish Score</button>
        <div id="scoreStatusMsg" class="status-msg"></div>
      </form>

      <!-- 2. OTHER EVENTS (PLACEMENTS) -->
      <form id="otherEventForm" class="form-section">
        <div class="form-group">
          <label class="form-label" for="otherEventName">Event / Activity Name</label>
          <input type="text" id="otherEventName" class="form-control" placeholder="e.g. Tug of War, Drama" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="otherCategory">Category</label>
          <select id="otherCategory" class="form-select" required>
            <option value="COMMON">Common / Open</option>
            <option value="MEN">Men</option>
            <option value="WOMEN">Women</option>
          </select>
        </div>

        <!-- 1st Place -->
        <div class="placement-card">
          <div class="placement-title">&#129351; 1st Place (Winner)</div>
          <div class="placement-grid">
            <select id="place1Team" class="form-select" required>
              <option value="" disabled selected>Winner</option>
              <option value="E22">E22</option>
              <option value="E23">E23</option>
              <option value="E24">E24</option>
              <option value="E25">E25</option>
              <option value="STAFF">STAFF</option>
            </select>
            <input type="number" id="place1Points" class="form-control" placeholder="Points" required />
          </div>
        </div>

        <!-- 2nd Place -->
        <div class="placement-card">
          <div class="placement-title">&#129352; 2nd Place</div>
          <div class="placement-grid">
            <select id="place2Team" class="form-select" required>
              <option value="" disabled selected>2nd Place</option>
              <option value="E22">E22</option>
              <option value="E23">E23</option>
              <option value="E24">E24</option>
              <option value="E25">E25</option>
              <option value="STAFF">STAFF</option>
              <option value="N/A">None / N/A</option>
            </select>
            <input type="number" id="place2Points" class="form-control" placeholder="Points" value="0" required />
          </div>
        </div>

        <!-- 3rd Place -->
        <div class="placement-card">
          <div class="placement-title">&#129353; 3rd Place</div>
          <div class="placement-grid">
            <select id="place3Team" class="form-select" required>
              <option value="" disabled selected>3rd Place</option>
              <option value="E22">E22</option>
              <option value="E23">E23</option>
              <option value="E24">E24</option>
              <option value="E25">E25</option>
              <option value="STAFF">STAFF</option>
              <option value="N/A">None / N/A</option>
            </select>
            <input type="number" id="place3Points" class="form-control" placeholder="Points" value="0" required />
          </div>
        </div>

        <button type="submit" class="btn-submit" id="submitOtherBtn">Save Results</button>
        <div id="otherStatusMsg" class="status-msg"></div>
      </form>

      <!-- 3. FIXTURES -->
      <form id="fixtureUpdateForm" class="form-section">
        <div class="form-group">
          <label class="form-label" for="fixDate">Match Date</label>
          <input type="text" id="fixDate" class="form-control" placeholder="e.g. Nov 21, 2026" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="fixTime">Match Time</label>
          <input type="text" id="fixTime" class="form-control" placeholder="e.g. 09:00 AM" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="fixSport">Sport / Event</label>
          <input type="text" id="fixSport" class="form-control" placeholder="e.g. Football Match 03" required />
        </div>

        <div class="form-group">
          <label class="form-label">Matchup</label>
          <div class="matchup-grid">
            <select id="fixTeamA" class="form-select" required>
              <option value="" disabled selected>Team A</option>
              <option value="E22">E22</option>
              <option value="E23">E23</option>
              <option value="E24">E24</option>
              <option value="E25">E25</option>
              <option value="STAFF">STAFF</option>
            </select>
            <span class="vs-badge">VS</span>
            <select id="fixTeamB" class="form-select" required>
              <option value="" disabled selected>Team B</option>
              <option value="E22">E22</option>
              <option value="E23">E23</option>
              <option value="E24">E24</option>
              <option value="E25">E25</option>
              <option value="STAFF">STAFF</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="fixVenue">Venue</label>
          <input type="text" id="fixVenue" class="form-control" placeholder="e.g. Main Ground" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="fixStatus">Schedule Status</label>
          <select id="fixStatus" class="form-select" required>
            <option value="Scheduled">Scheduled</option>
            <option value="Upcoming">Upcoming</option>
            <option value="Postponed">Postponed</option>
          </select>
        </div>

        <button type="submit" class="btn-submit" id="submitFixtureBtn">Publish Fixture</button>
        <div id="fixtureStatusMsg" class="status-msg"></div>
      </form>

      <!-- 4. NEWS FEED (With Drive Upload) -->
      <form id="newsUpdateForm" class="form-section">
        <div class="form-group">
          <label class="form-label" for="newsTitle">News Headline</label>
          <input type="text" id="newsTitle" class="form-control" placeholder="e.g. E23 Clinches Badminton Trophy!" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="newsCategory">Category Tag</label>
          <select id="newsCategory" class="form-select" required>
            <option value="LIVE UPDATE">LIVE UPDATE</option>
            <option value="ANNOUNCEMENT">ANNOUNCEMENT</option>
            <option value="TOURNAMENT ALERT">TOURNAMENT ALERT</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="newsImageFile">Upload Image (Public Google Drive File)</label>
          <input type="file" id="newsImageFile" class="form-control" accept="image/png, image/jpeg, image/webp" />
          <div id="imagePreviewWrapper" class="image-preview-wrapper">
            <img id="imagePreview" alt="Image preview" />
            <div class="image-preview-info" id="imagePreviewInfo"></div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="newsImageURL">Or Image URL (Fallback)</label>
          <input type="url" id="newsImageURL" class="form-control" placeholder="https://example.com/photo.jpg" />
        </div>

        <div class="form-group">
          <label class="form-label" for="newsDescription">Description / Details</label>
          <textarea id="newsDescription" class="form-control" rows="4" placeholder="Enter article content..." required></textarea>
        </div>

        <div class="form-group">
          <label class="form-label" for="newsActive">Status</label>
          <select id="newsActive" class="form-select" required>
            <option value="TRUE">Active (Display on Homepage)</option>
            <option value="FALSE">Inactive (Hidden)</option>
          </select>
        </div>

        <button type="submit" class="btn-submit" id="submitNewsBtn">Publish News</button>
        <div id="newsStatusMsg" class="status-msg"></div>
      </form>
    </div>
  </main>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxzo1KtK5zMkmLykmHdjJRqzNEtGccwfM1wGNF7JGB6mYiRDBJdSQ3cboJo4-hRerV4TQ/exec";

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));

      const tabs = ['scores', 'other', 'fixtures', 'news'];
      const forms = ['scoreUpdateForm', 'otherEventForm', 'fixtureUpdateForm', 'newsUpdateForm'];
      const idx = tabs.indexOf(tab);

      if (idx !== -1) {
        document.querySelectorAll('.tab-btn')[idx].classList.add('active');
        document.getElementById(forms[idx]).classList.add('active');
      }
    }

    // Image preview & Base64 encoder
    let selectedImageBase64 = null;
    let selectedImageFilename = null;
    let selectedImageMime = null;

    document.getElementById("newsImageFile").addEventListener("change", function(e) {
      const file = e.target.files[0];
      const previewWrapper = document.getElementById("imagePreviewWrapper");
      const previewImg = document.getElementById("imagePreview");
      const previewInfo = document.getElementById("imagePreviewInfo");

      if (file) {
        selectedImageFilename = file.name;
        selectedImageMime = file.type;
        const reader = new FileReader();
        reader.onload = function(event) {
          const fullDataUrl = event.target.result;
          previewImg.src = fullDataUrl;
          selectedImageBase64 = fullDataUrl.split(',')[1];
          previewInfo.innerHTML = `<strong>${file.name}</strong><br>${(file.size / 1024).toFixed(1)} KB`;
          previewWrapper.style.display = "flex";
        };
        reader.readAsDataURL(file);
      } else {
        selectedImageBase64 = null;
        selectedImageFilename = null;
        selectedImageMime = null;
        previewWrapper.style.display = "none";
      }
    });

    // Helper for requests
    async function sendData(payload, btn, msgBox, successText, formId) {
      btn.disabled = true;
      const originalText = btn.textContent;
      btn.textContent = "SENDING...";
      msgBox.textContent = "";

      try {
        await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        msgBox.style.color = "var(--color-emerald)";
        msgBox.textContent = `SUCCESS: ${successText}`;
        document.getElementById(formId).reset();
        if (formId === 'newsUpdateForm') {
          document.getElementById("imagePreviewWrapper").style.display = "none";
          selectedImageBase64 = null;
          selectedImageFilename = null;
          selectedImageMime = null;
        }
      } catch (err) {
        msgBox.style.color = "var(--color-crimson)";
        msgBox.textContent = "Error communicating with server.";
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    }

    // 1. Scores Submit
    document.getElementById("scoreUpdateForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const teamA = document.getElementById("teamASelect").value;
      const teamB = document.getElementById("teamBSelect").value;
      const msg = document.getElementById("scoreStatusMsg");

      if (teamA === teamB) {
        msg.style.color = "var(--color-crimson)";
        msg.textContent = "Error: Team A and Team B cannot be the same.";
        return;
      }

      sendData({
        action: "updateScore",
        sport: document.getElementById("eventSelect").value,
        category: document.getElementById("categorySelect").value,
        teamA, teamB,
        scoreA: document.getElementById("scoreA").value,
        scoreB: document.getElementById("scoreB").value,
        status: document.getElementById("matchStatus").value,
        timestamp: new Date().toISOString()
      }, document.getElementById("submitScoreBtn"), msg, "Score published successfully!", "scoreUpdateForm");
    });

    // 2. Placements Submit
    document.getElementById("otherEventForm").addEventListener("submit", function(e) {
      e.preventDefault();
      sendData({
        action: "updateOtherEvent",
        eventName: document.getElementById("otherEventName").value.trim(),
        category: document.getElementById("otherCategory").value,
        place1Team: document.getElementById("place1Team").value,
        place1Pts: document.getElementById("place1Points").value,
        place2Team: document.getElementById("place2Team").value,
        place2Pts: document.getElementById("place2Points").value,
        place3Team: document.getElementById("place3Team").value,
        place3Pts: document.getElementById("place3Points").value,
        timestamp: new Date().toISOString()
      }, document.getElementById("submitOtherBtn"), document.getElementById("otherStatusMsg"), "Results recorded!", "otherEventForm");
    });

    // 3. Fixture Submit
    document.getElementById("fixtureUpdateForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const teamA = document.getElementById("fixTeamA").value;
      const teamB = document.getElementById("fixTeamB").value;
      const msg = document.getElementById("fixtureStatusMsg");

      if (teamA === teamB) {
        msg.style.color = "var(--color-crimson)";
        msg.textContent = "Error: Team A and Team B cannot be the same.";
        return;
      }

      sendData({
        action: "updateFixture",
        date: document.getElementById("fixDate").value,
        time: document.getElementById("fixTime").value,
        sport: document.getElementById("fixSport").value,
        teamA, teamB,
        venue: document.getElementById("fixVenue").value,
        status: document.getElementById("fixStatus").value,
        timestamp: new Date().toISOString()
      }, document.getElementById("submitFixtureBtn"), msg, "Fixture scheduled!", "fixtureUpdateForm");
    });

    // 4. News Submit
    document.getElementById("newsUpdateForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const msg = document.getElementById("newsStatusMsg");
      const fallbackUrl = document.getElementById("newsImageURL").value.trim();

      if (!selectedImageBase64 && !fallbackUrl) {
        msg.style.color = "var(--color-crimson)";
        msg.textContent = "Please select an image file or provide an Image URL.";
        return;
      }

      sendData({
        action: "updateNews",
        title: document.getElementById("newsTitle").value,
        category: document.getElementById("newsCategory").value,
        imageUrl: fallbackUrl,
        imageFileBase64: selectedImageBase64 || null,
        imageFileName: selectedImageFilename || null,
        imageMimeType: selectedImageMime || null,
        description: document.getElementById("newsDescription").value,
        active: document.getElementById("newsActive").value,
        timestamp: new Date().toISOString()
      }, document.getElementById("submitNewsBtn"), msg, "News broadcasted!", "newsUpdateForm");
    });

    // Lightweight Particle Background
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let w = canvas.width = window.innerWidth;
    let h = canvas.height = window.innerHeight;
    window.addEventListener('resize', () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; });
    const particles = Array.from({ length: 28 }, () => ({
      x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.8 + 0.4,
      alpha: Math.random() * 0.5 + 0.2, vy: -(Math.random() * 0.4 + 0.15)
    }));
    function anim() {
      ctx.clearRect(0, 0, w, h);
      particles.forEach(p => {
        p.y += p.vy;
        if (p.y < 0) { p.y = h + 10; p.x = Math.random() * w; }
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(216, 230, 248, ${p.alpha})`; ctx.fill();
      });
      requestAnimationFrame(anim);
    }
    anim();
  </script>
</body>
</html>
