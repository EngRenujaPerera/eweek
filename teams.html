     ========================================================================== -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-WEEK 2026 | Teams & Google Sheets Roster Sync</title>
  <meta name="description" content="Explore event-by-event live synchronized rosters for E-WEEK 2026 at the Faculty of Engineering, University of Jaffna." />

  <!-- Google Fonts: Cinematic Serif and Clean UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --color-obsidian: #080a0f;
      --color-charcoal: #0e1117;
      --color-silver-pure: #ffffff;
      --color-silver-bright: #e2e7f0;
      --color-silver-mid: #cbd5e1;
      --color-silver-dark: #94a3b8;
      --font-display: 'Cinzel', serif;
      --font-heading: 'Cinzel', serif;
      --font-body: 'Inter', sans-serif;
      --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; background-color: var(--color-obsidian); color: var(--color-silver-bright); font-family: var(--font-body); }
    body { min-height: 100vh; background: var(--color-obsidian); position: relative; overflow-x: hidden; }

    /* Custom Modern Dark Glass Scrollbar for Athletes Lists */
    .athletes-list::-webkit-scrollbar { width: 6px; }
    .athletes-list::-webkit-scrollbar-track { background: rgba(11, 13, 18, 0.5); border-radius: 3px; }
    .athletes-list::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.4); border-radius: 3px; transition: background 0.3s ease; }
    .athletes-list::-webkit-scrollbar-thumb:hover { background: rgba(226, 231, 240, 0.8); }

    /* Background Video & Effects */
    #video-background-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; overflow: hidden; filter: contrast(1.2) brightness(0.7); }
    #bg-video { width: 100%; height: 100%; object-fit: cover; }
    #particle-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; }
    .cinematic-lens-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 3; pointer-events: none;
      background: radial-gradient(circle at 50% 45%, rgba(4, 6, 12, 0.1) 30%, rgba(4, 6, 12, 0.9) 95%),
                  linear-gradient(to bottom, rgba(5,7,11,0.6) 0%, transparent 30%, transparent 70%, rgba(5,7,11,0.95) 100%);
    }

    .audio-toggle-widget {
      position: fixed; bottom: 24px; right: 24px; z-index: 1001;
      background: rgba(14, 17, 23, 0.85); border: 1px solid var(--color-silver-mid);
      border-radius: 50%; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
      color: #fff; cursor: pointer; backdrop-filter: blur(10px); box-shadow: 0 8px 25px rgba(0,0,0,0.8);
      transition: var(--transition-smooth);
    }
    .audio-toggle-widget:hover { transform: scale(1.1); border-color: #fff; }

    .container { width: 92%; max-width: 1300px; margin: 0 auto; position: relative; z-index: 10; }

    header {
      position: fixed; top: 0; left: 0; width: 100%; z-index: 100; padding: 18px 5%;
      background: rgba(8, 10, 15, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(226,231,240,0.15);
      display: flex; justify-content: space-between; align-items: center;
    }
    .back-home { font-family: var(--font-heading); font-size: 0.85rem; letter-spacing: 0.2em; color: var(--color-silver-bright); text-decoration: none; }
    .back-home:hover { color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.6); }

    .teams-main-section { padding: 140px 0 90px; position: relative; z-index: 10; text-align: center; }
    .section-title { font-family: var(--font-display); font-size: clamp(2.2rem, 4vw, 3.2rem); color: #fff; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 10px; }
    .section-subtitle { font-size: 1.1rem; color: var(--color-stone-light, #8f9bb3); margin-bottom: 35px; }

    /* Interactive Batch Tabs */
    .batch-tabs-grid { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-bottom: 40px; }
    .batch-tab-btn {
      font-family: var(--font-heading); font-size: 0.85rem; font-weight: 700; letter-spacing: 0.2em;
      padding: 12px 26px; background: rgba(18, 22, 32, 0.85); border: 1px solid rgba(197, 160, 89, 0.3);
      color: var(--color-silver-bright); border-radius: 4px; cursor: pointer; transition: var(--transition-smooth);
      box-shadow: 0 10px 25px rgba(0,0,0,0.6); backdrop-filter: blur(8px);
    }
    .batch-tab-btn:hover, .batch-tab-btn.active {
      background: linear-gradient(135deg, #c5a059 0%, #8c6239 100%);
      color: #0b0d12; border-color: #fff; box-shadow: 0 0 25px rgba(197, 160, 89, 0.5);
      transform: translateY(-2px);
    }

    /* Initial State Showcase */
    .initial-placeholder {
      padding: 90px 20px;
      text-align: center;
      background: linear-gradient(145deg, rgba(18, 22, 32, 0.7) 0%, rgba(10, 13, 19, 0.85) 100%);
      border: 1px dashed rgba(197, 160, 89, 0.3);
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }
    .initial-placeholder h3 {
      font-family: var(--font-display);
      font-size: 1.6rem;
      letter-spacing: 0.15em;
      color: #fff;
      margin-bottom: 12px;
    }
    .initial-placeholder p {
      font-family: var(--font-story);
      font-size: 1.25rem;
      color: var(--color-stone-light);
    }

    /* Animated Batch Emblem Spotlight Header */
    .batch-spotlight-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 45px;
      opacity: 0;
      transform: scale(0.8) translateY(20px);
      transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .batch-spotlight-container.animate-in {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    .spotlight-emblem {
      width: 120px;
      height: 120px;
      object-fit: contain;
      margin-bottom: 16px;
      filter: drop-shadow(0 15px 30px rgba(0,0,0,0.9)) drop-shadow(0 0 25px rgba(197, 160, 89, 0.4));
      animation: emblemFloat 4s ease-in-out infinite alternate;
    }

    @keyframes emblemFloat {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-8px) rotate(2deg); }
    }

    .spotlight-title {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 0.2em;
      color: #fff;
      text-shadow: 0 0 20px rgba(255,255,255,0.4);
    }

    /* Event Cards Grid Layout */
    .events-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 28px;
      text-align: left;
    }

    .event-card {
      background: linear-gradient(145deg, rgba(18, 22, 32, 0.92) 0%, rgba(10, 13, 19, 0.98) 100%);
      border: 1px solid rgba(80, 95, 122, 0.4);
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      backdrop-filter: blur(14px);
      transition: var(--transition-smooth);
      opacity: 0;
      transform: translateY(25px);
      animation: cardAppear 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardAppear {
      to { opacity: 1; transform: translateY(0); }
    }

    .event-card:hover {
      border-color: rgba(226, 231, 240, 0.7);
      box-shadow: 0 25px 60px rgba(0,0,0,0.9), 0 0 25px rgba(226, 231, 240, 0.15);
      transform: translateY(-5px);
    }

    .event-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 14px;
      margin-bottom: 18px;
    }

    .event-card-title {
      font-family: var(--font-display);
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: #fff;
    }

    .event-category-badge {
      font-family: var(--font-heading);
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      padding: 4px 10px;
      background: rgba(30, 36, 50, 0.9);
      border: 1px solid rgba(226, 231, 240, 0.25);
      border-radius: 20px;
      color: var(--color-silver-bright);
      text-transform: uppercase;
    }

    .athletes-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 8px;
      scrollbar-width: thin;
      scrollbar-color: rgba(148, 163, 184, 0.4) rgba(11, 13, 18, 0.5);
    }

    .athlete-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(8, 10, 15, 0.55);
      border: 1px solid rgba(255,255,255,0.05);
      padding: 10px 14px;
      border-radius: 4px;
      transition: background 0.2s;
    }

    .athlete-item:hover {
      background: rgba(255,255,255,0.08);
    }

    .athlete-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--color-silver-bright);
      text-transform: uppercase;
    }

    .captain-tag {
      font-family: var(--font-heading);
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      color: #ffd700;
      border: 1px solid #ffd700;
      padding: 2px 8px;
      border-radius: 2px;
      background: rgba(255, 215, 0, 0.08);
    }

    .no-athletes-msg {
      font-style: italic;
      color: var(--color-stone-light);
      font-size: 0.9rem;
      text-align: center;
      padding: 20px 0;
    }

    .loading-spinner {
      text-align: center;
      padding: 60px;
      font-family: var(--font-heading);
      letter-spacing: 0.2em;
      color: var(--color-silver-mid);
    }

    @media (max-width: 768px) {
      .events-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

  <div id="video-background-container" aria-hidden="true">
    <video id="bg-video" autoplay muted loop playsinline><source src="bg.mp4" type="video/mp4"></video>
  </div>
  <canvas id="particle-canvas" aria-hidden="true"></canvas>
  <div class="cinematic-lens-overlay" aria-hidden="true"></div>

  <!-- Background Audio Element -->
  <audio id="bg-audio" loop>
    <source src="bg.mp3" type="audio/mpeg">
  </audio>

  <!-- Interactive Audio Control Widget -->
  <button class="audio-toggle-widget" id="audioToggleBtn" title="Toggle Cinematic Sound">
    <svg id="audioIcon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
    </svg>
  </button>

  <header>
    <a href="index.html" class="back-home">&larr; BACK TO HOME</a>
    <div style="font-family: var(--font-heading); font-size: 0.9rem; letter-spacing: 0.15em; color: #fff;">E-WEEK 2026 &bull; TEAM ROSTERS</div>
  </header>

  <main class="container teams-main-section">
    <span class="section-eyebrow">COMPETITION EVENT SQUADS</span>
    <h1 class="section-title">TEAMS & EVENTS</h1>
    <p class="section-subtitle">Select any batch below to synchronize and inspect participant rosters event by event.</p>

    <!-- Batch Tabs (Initially none selected) -->
    <div class="batch-tabs-grid" id="batchTabsContainer">
      <button class="batch-tab-btn" data-batch="E23" data-logo="image/e23.png">E23</button>
      <button class="batch-tab-btn" data-batch="E22" data-logo="image/e22.png">E22</button>
      <button class="batch-tab-btn" data-batch="E24" data-logo="image/e24.png">E24</button>
      <button class="batch-tab-btn" data-batch="E25" data-logo="image/e25.png">E25</button>
      <button class="batch-tab-btn" data-batch="STAFF" data-logo="image/staff.png">STAFF</button>
    </div>

    <!-- Dynamic Content Mount Area -->
    <div id="eventsMount">
      <div class="initial-placeholder">
        <h3>SELECT A BATCH TO BEGIN</h3>
        <p>Click any batch tab above to load and animate squad rosters.</p>
      </div>
    </div>
  </main>

  <script>
    const SPORTS_CONFIG = [
      { id: "cricket", name: "Cricket", categories: ["MEN", "WOMEN"] },
      { id: "football", name: "Football", categories: ["MEN", "WOMEN"] },
      { id: "volleyball", name: "Volleyball", categories: ["MEN", "WOMEN"] },
      { id: "elle", name: "Elle", categories: ["MEN", "WOMEN"] },
      { id: "badminton", name: "Badminton", categories: ["MEN", "WOMEN"] },
      { id: "tabletennis", name: "Table Tennis", categories: ["MEN", "WOMEN"] },
      { id: "carrom", name: "Carrom", categories: ["MEN", "WOMEN"] },
      { id: "chess", name: "Chess", categories: ["MEN", "WOMEN"] },
      { id: "basketball", name: "Basketball", categories: ["MEN"] },
      { id: "netball", name: "Netball", categories: ["WOMEN"] },
      { id: "debate", name: "Debate", categories: ["MEN"], hideBadge: true },
      { id: "espeaker", name: "E Speaker", categories: ["MEN"], hideBadge: true },
      { id: "100m", name: "100m Athletics", categories: ["MEN"], hideBadge: true },
      { id: "200m", name: "200m Athletics", categories: ["MEN"], hideBadge: true },
      { id: "400m", name: "400m Athletics", categories: ["MEN"], hideBadge: true },
      { id: "800m", name: "800m Athletics", categories: ["MEN"], hideBadge: true },
      { id: "1500m", name: "1500m Athletics", categories: ["MEN"], hideBadge: true },
      { id: "marathon", name: "Marathon", categories: ["MEN"], hideBadge: true },
      { id: "100m_hurdles", name: "100m Hurdles", categories: ["MEN"], hideBadge: true },
      { id: "4x100", name: "4x100m Relay", categories: ["MEN"], hideBadge: true },
      { id: "4x400", name: "4x400m Relay", categories: ["MEN"], hideBadge: true },
      { id: "high_jump", name: "High Jump", categories: ["MEN"], hideBadge: true },
      { id: "longjump", name: "Long Jump", categories: ["MEN"], hideBadge: true },
      { id: "shotput", name: "Shot Put", categories: ["MEN"], hideBadge: true },
      { id: "discuss_throw", name: "Discuss Throw", categories: ["MEN"], hideBadge: true },
      { id: "javelin_throw", name: "Javelin Throw", categories: ["MEN"], hideBadge: true }
    ];

    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxkFJsbdHQFZDAiFYWXyCIUvGbmbt0PxGqSGjm_FCEFvjSIC11CUEFyrhlcK30pzJ9fBg/exec";
    const rosterCache = {};

    document.addEventListener("DOMContentLoaded", () => {
      initBatchTabs();
      initParticles();
      initBackgroundAudio();
    });

    function initBatchTabs() {
      const buttons = document.querySelectorAll('.batch-tab-btn');
      buttons.forEach(btn => {
        btn.addEventListener('click', (e) => {
          buttons.forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          const batch = e.target.getAttribute('data-batch');
          const logo = e.target.getAttribute('data-logo');
          fetchAndRenderBatch(batch, logo);
        });
      });
    }

    function fetchAndRenderBatch(batch, logoSrc) {
      const mount = document.getElementById('eventsMount');

      if (rosterCache[batch]) {
        renderWithSpotlight(batch, logoSrc, rosterCache[batch]);
        return;
      }

      mount.innerHTML = `<div class="loading-spinner">SYNCHRONIZING ROSTERS FOR ${batch}...</div>`;

      const cbName = 'batch_cb_' + Math.round(Math.random() * 1000000);
      window[cbName] = function(res) {
        delete window[cbName];
        if (scriptElem && scriptElem.parentNode) document.body.removeChild(scriptElem);

        let batchRosters = (res && res.rosters) ? res.rosters : {};
        rosterCache[batch] = batchRosters;
        renderWithSpotlight(batch, logoSrc, batchRosters);
      };

      const scriptElem = document.createElement('script');
      scriptElem.src = `${APPS_SCRIPT_URL}?batch=${batch}&callback=${cbName}`;
      scriptElem.onerror = () => {
        if (window[cbName]) delete window[cbName];
        if (scriptElem.parentNode) document.body.removeChild(scriptElem);
        mount.innerHTML = `<div class="loading-spinner" style="color:#ff4d4d;">Failed to sync with Google Sheets. Please check your Web App deployment.</div>`;
      };
      document.body.appendChild(scriptElem);
    }

    function renderWithSpotlight(batch, logoSrc, batchRosters) {
      const mount = document.getElementById('eventsMount');
      let eventMap = {};

      SPORTS_CONFIG.forEach(s => {
        s.categories.forEach(cat => {
          eventMap[`${s.id}_${cat}`] = {
            sportName: s.name,
            category: cat,
            hideBadge: !!s.hideBadge,
            players: []
          };
        });
      });

      Object.keys(batchRosters).forEach(sheetKey => {
        const players = batchRosters[sheetKey];
        const parts = sheetKey.split('_');
        if (parts.length >= 2) {
          const cat = parts[0].toUpperCase();
          const sportId = parts.slice(1).join('_').toLowerCase();
          const mapKey = `${sportId}_${cat}`;
          if (eventMap[mapKey]) {
            eventMap[mapKey].players = players.map(p => ({
              name: (p.name || p.FullName || p['Full Name'] || '').toUpperCase(),
              isCaptain: p.isCaptain === true || String(p.isCaptain).toUpperCase() === 'TRUE'
            }));
          }
        }
      });

      // Construct HTML with animated batch logo spotlight header
      let html = `
        <div class="batch-spotlight-container" id="spotlightBox">
          <img src="${logoSrc}" alt="${batch} Logo" class="spotlight-emblem" onerror="this.style.display='none';" />
          <h2 class="spotlight-title">${batch} SQUAD ROSTERS</h2>
        </div>
        <div class="events-grid">
      `;

      let delay = 0.05;
      Object.keys(eventMap).forEach(key => {
        const ev = eventMap[key];
        delay += 0.025;

        html += `
          <div class="event-card" style="animation-delay: ${delay}s;">
            <div class="event-card-header">
              <h3 class="event-card-title">${ev.sportName}</h3>
              ${!ev.hideBadge ? `<span class="event-category-badge">${ev.category}</span>` : ''}
            </div>
            <ul class="athletes-list">
        `;

        if (ev.players.length === 0) {
          html += `<li class="no-athletes-msg">No team roster submitted yet.</li>`;
        } else {
          ev.players.forEach(p => {
            html += `
              <li class="athlete-item">
                <span class="athlete-name">${p.name}</span>
                ${p.isCaptain ? '<span class="captain-tag">CAPTAIN</span>' : ''}
              </li>
            `;
          });
        }

        html += `
            </ul>
          </div>
        `;
      });

      html += `</div>`;
      mount.innerHTML = html;

      // Trigger spotlight scale-in animation
      setTimeout(() => {
        const box = document.getElementById('spotlightBox');
        if (box) box.classList.add('animate-in');
      }, 50);
    }

    function initParticles() {
      const canvas = document.getElementById('particle-canvas');
      const ctx = canvas.getContext('2d');
      let w = canvas.width = window.innerWidth;
      let h = canvas.height = window.innerHeight;
      window.addEventListener('resize', () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; });
      const particles = Array.from({ length: 60 }, () => ({
        x: Math.random() * w, y: Math.random() * h, r: Math.random() * 2 + 0.5,
        alpha: Math.random() * 0.7 + 0.2, vy: -(Math.random() * 0.6 + 0.2)
      }));
      function anim() {
        ctx.clearRect(0, 0, w, h);
        particles.forEach(p => {
          p.y += p.vy;
          if (p.y < 0) { p.y = h + 10; p.x = Math.random() * w; }
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(216, 230, 248, ${p.alpha})`; ctx.fill();
        });
        requestAnimationFrame(anim);
      }
      anim();
    }

    function initBackgroundAudio() {
      const audio = document.getElementById('bg-audio');
      const toggleBtn = document.getElementById('audioToggleBtn');
      let isPlaying = false;
      const startAudio = () => { if (!isPlaying) { audio.play().then(() => isPlaying = true).catch(() => {}); } };
      window.addEventListener('click', startAudio, { once: true });
      window.addEventListener('scroll', startAudio, { once: true });
      toggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (isPlaying) { audio.pause(); isPlaying = false; toggleBtn.style.opacity = '0.5'; }
        else { audio.play(); isPlaying = true; toggleBtn.style.opacity = '1'; }
      });
    }
  </script>
</body>
</html>
